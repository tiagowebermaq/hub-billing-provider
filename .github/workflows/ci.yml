name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: mypy src
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes unitários no container
        run: |
          docker build -f docker/Dockerfile --target test -t hub-billing:test .
          docker run --rm hub-billing:test
      - name: Imagem de produção
        run: docker build -f docker/Dockerfile --target runtime -t hub-billing:ci .
