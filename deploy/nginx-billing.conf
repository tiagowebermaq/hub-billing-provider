# Para quando a VM já tem um nginx atendendo as portas 80/443 (por exemplo, o do omnichannel).
# O publicar.sh mostra como instalar: copia para /etc/nginx/sites-available/billing.heimber.com.br,
# ativa, e pega o certificado com:  sudo certbot --nginx -d billing.heimber.com.br
server {
    listen 80;
    server_name billing.heimber.com.br;

    client_max_body_size 25m;   # upload de faturas em PDF

    location = / { return 302 /painel; }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
