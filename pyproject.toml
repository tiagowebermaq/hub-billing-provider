[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-billing-provider"
version = "0.1.0"
description = "Hub que agrupa contas de energia e água e as envia ao sistema de aluguéis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "aio-pika>=9.4",
  "redis>=5.0",
  "httpx>=0.27",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
portal = ["playwright>=1.45"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "fakeredis>=2.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "playwright>=1.45",
]

[project.scripts]
hub-worker = "hub_billing.workers.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["hub_billing"]
omit = ["*/workers/run.py"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
